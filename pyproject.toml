[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bhashapy"
version = "1.0.0"
description = "A fresh Hinglish-flavored Python transpiler, REPL, and CLI with smart typo suggestions"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
bhashapy = "bhashapy_lang:main"

[tool.setuptools]
py-modules = ["bhashapy_lang"]
